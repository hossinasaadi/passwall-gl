<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PassWall GL preview (phone width)</title>
    <style>
      body { margin: 0; background: #f5f7fa; }
      /* Centred: the screenshot script crops the middle 390 px. */
      iframe { display: block; border: 0; width: 390px; height: 844px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <!-- Headless Chrome won't lay a window out narrower than about 500 px,
         so the screenshot script renders the page in a phone-sized frame. -->
    <iframe id="phone" title="PassWall preview"></iframe>
    <script>
      document.getElementById('phone').src = './' + location.search
    </script>
  </body>
</html>
